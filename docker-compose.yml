services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydb
    depends_on:
      - ollama
      - redis
      - postgres
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    command: serve
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - app-network

  redis:
    image: redis:latest
    command: redis-server --requirepass mysecretpassword --maxmemory 100mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    networks:
      - app-network

  celery:
    build: .
    image: celery:latest
    command: celery -A ai_project worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - ollama
      - postgres
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydb
    networks:
      - app-network

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - app-network

volumes:
  ollama-data:
  postgres-data:

networks:
  app-network:
    driver: bridge
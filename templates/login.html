{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/signinup.css' %}" />
  </head>
  <body>
    <div class="form_container">
      <h1 class="form_title">Login to Your Account</h1>

      {% if messages %}
      <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="input_group">
          <label for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }} {{ form.username.errors }}
        </div>
        <div class="input_group">
          <label for="{{ form.password.id_for_label }}">Password</label>
          {{ form.password }} {{ form.password.errors }}
        </div>
        <button class="submit_btn" type="submit">Login</button>
      </form>

      <p class="switch_text">
        Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
      </p>
    </div>
  </body>
</html>

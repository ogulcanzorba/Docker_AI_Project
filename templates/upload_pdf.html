<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Lecture PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h2 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Lecture PDF - {{ lecture_title }}</h2>
        <form id="upload-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <select name="lecture_name" required>
                <option value="" disabled selected>Select a lecture</option>
                {% for key, config in lecture_config.items %}
                    <option value="{{ key }}" {% if key == lecture_name %}selected{% endif %}>{{ config.title }}</option>
                {% endfor %}
            </select>
            <input type="file" name="pdf_file" accept=".pdf" required>
            <button type="submit">Upload and Process</button>
        </form>
        <div id="status"></div>
        {% if messages %}
            {% for message in messages %}
                <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    </div>
    <script>
        document.getElementById('upload-form').addEventListener('submit', function(e) {
            e.preventDefault();
            let form = this;
            let formData = new FormData(form);
            document.getElementById('status').innerText = 'Processing, please wait...';
            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('status').innerText = 'Error: ' + data.error;
                    return;
                }
                document.getElementById('status').innerText = data.status || 'Task started';
                if (data.task_id) {
                    let checkStatus = setInterval(() => {
                        fetch(`/task/${data.task_id}/`)
                            .then(res => res.json())
                            .then(status => {
                                console.log('Task status:', status);
                                if (status.status === 'SUCCESS') {
                                    clearInterval(checkStatus);
                                    let lectureName = form.querySelector('select[name="lecture_name"]').value;
                                    window.location.href = `/lecture/${lectureName}/`;
                                } else if (status.status === 'FAILURE') {
                                    clearInterval(checkStatus);
                                    document.getElementById('status').innerText = 'Error: ' + (status.error || 'Task failed');
                                } else {
                                    document.getElementById('status').innerText = 'Processing (Status: ' + status.status + ')';
                                }
                            })
                            .catch(error => {
                                console.error('Status fetch error:', error);
                                document.getElementById('status').innerText = 'Error checking task status';
                                clearInterval(checkStatus);
                            });
                    }, 2000);
                }
            })
            .catch(error => {
                console.error('Upload error:', error);
                document.getElementById('status').innerText = 'Error uploading file';
            });
        });
    </script>
</body>

</html>

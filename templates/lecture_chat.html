<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ lecture_title }} | CS Tutor</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/chat.css' %}">
</head>

<body>
  <header>
    <nav class="navbar">
      <a href="{% url 'lecture_list' %}" class="nav-brand">CS Tutor</a>
      <div class="nav-links">
        <span>Welcome, {{ request.user.username }}</span>
        <a href="{% url 'lecture_list' %}">Lectures</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="nav-button">Logout</button>
        </form>
      </div>
    </nav>
  </header>

  <div class="container">
    <h2>{{ lecture_title }}</h2>
    <div class="card-container">
      <div class="card-header">
        <div class="img-avatar"></div>
        <div class="text-chat">Chat</div>
      </div>
      <div class="card-body">
        <div class="messages-container" id="chat-box">
          {% include "partials/lecture_chat.html" %}
        </div>
        <div class="message-input">
          <form method="post" id="chat-form">
            {% csrf_token %}
            <textarea name="question" id="user-question" placeholder="Ask about {{ lecture_title }}..." class="message-send" required></textarea>
            <button type="submit" class="button-send">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('chat-form');
      const input = document.getElementById('user-question');
      const chatBox = document.getElementById('chat-box');
      const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        const question = input.value.trim();
        if (!question) return;

        fetch('', {
          method: 'POST',
          headers: {
            'X-CSRFToken': csrfToken,
            'X-Requested-With': 'XMLHttpRequest',
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({ question: question })
        })
          .then(response => response.json())
          .then(data => {
            chatBox.innerHTML = data.html;
            chatBox.scrollTop = chatBox.scrollHeight;
          })
          .catch(error => console.error('Error:', error));

        input.value = '';
      });
    });
  </script>
</body>
</html>

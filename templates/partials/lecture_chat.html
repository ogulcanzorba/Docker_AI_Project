{% for message in chat_history %}
  {% if message.user_input %}
    <div class="message-box right">
      <p>{{ message.user_input }}</p>
    </div>
  {% endif %}
  {% if message.bot_response %}
    <div class="message-box left">
      <p>{{ message.bot_response }}</p>
    </div>
  {% endif %}
{% endfor %}
